services:
  mongo:
    image: mongo
    restart: no
    environment:
      MONGO_INITDB_ROOT_USERNAME: ceotr
      MONGO_INITDB_ROOT_PASSWORD: ceotr
    volumes:
      - /tmp/mongo:/data/db
  mongo-express:
    image: mongo-express
    depends_on:
      - mongo
    restart: no
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://ceotr:ceotr@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  backend:
    image: glider-automation-backend
    restart: unless-stopped
    build:
      context: ../
      dockerfile: ./docker/backend.dockerfile
    environment:
      - ATLAS_URI=mongodb://ceotr:ceotr@mongo:27017/?authSource=admin
    volumes:
      - backend_uploads:/usr/src/app/uploads
    ports:
      - 3000:3000
    depends_on:
      - mongo

  frontend:
    image: glider-automation-frontend
    restart: unless-stopped
    build:
      context: ../
      dockerfile: ./docker/frontend.dockerfile
    ports:
      - 8080:8080

volumes:
  backend_uploads:
